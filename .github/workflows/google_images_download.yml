name: Bing Image Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو (مثال: "cat" یا "mountain landscape")'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string
      quality:
        description: 'کیفیت تصاویر (high/medium)'
        required: false
        default: 'high'
        type: choice
        options:
          - high
          - medium

jobs:
  download-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # برای دسترسی به تاریخچه کامل
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install bing-image-downloader
    
    - name: Run Bing image downloader
      env:
        SEARCH_QUERY: ${{ github.event.inputs.search_query }}
        NUM_IMAGES: ${{ github.event.inputs.num_images }}
        QUALITY: ${{ github.event.inputs.quality }}
      run: |
        python google_images_downloader.py "$SEARCH_QUERY" "$NUM_IMAGES" "$QUALITY"
    
    - name: Commit and push images to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # اضافه کردن فایل‌های جدید به git
        git add downloads/*.zip 2>/dev/null || true
        git add images/ 2>/dev/null || true
        
        # اگر تغییری وجود داشت، commit و push کن
        if ! git diff --cached --quiet; then
          git commit -m "Add downloaded images for: ${{ github.event.inputs.search_query }} [skip ci]"
          git push
          echo "✅ فایل‌ها با موفقیت به ریپازیتوری اضافه شدند"
        else
          echo "ℹ️ هیچ فایل جدیدی برای commit وجود ندارد"
        fi
