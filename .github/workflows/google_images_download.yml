name: DuckDuckGo Image Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو (مثال: "cat" یا "mountain landscape")'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string
      quality:
        description: 'کیفیت تصاویر (high/medium)'
        required: false
        default: 'high'
        type: choice
        options:
          - high
          - medium

jobs:
  download-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run DuckDuckGo image downloader
      env:
        SEARCH_QUERY: ${{ github.event.inputs.search_query }}
        NUM_IMAGES: ${{ github.event.inputs.num_images }}
        QUALITY: ${{ github.event.inputs.quality }}
      run: |
        python google_images_downloader.py "$SEARCH_QUERY" "$NUM_IMAGES" "$QUALITY"
    
    - name: Upload images as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: duckduckgo-images-${{ github.event.inputs.search_query }}-${{ github.run_number }}
        path: downloads/*.zip
        retention-days: 7
        if-no-files-found: warn
    
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: report-${{ github.event.inputs.search_query }}-${{ github.run_number }}
        path: downloads/*.json
        retention-days: 7
        if-no-files-found: warn
    
    - name: Commit files to repository
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add downloads/*.zip downloads/*.json 2>/dev/null || true
        git commit -m "Add downloaded images for: ${{ github.event.inputs.search_query }}" || echo "No new images to commit"
        git push || echo "Push skipped"
