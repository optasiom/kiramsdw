name: Google Images Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو (مثال: "cat" یا "پرسپولیس")'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string
      quality:
        description: 'کیفیت تصاویر (high/medium)'
        required: false
        default: 'high'
        type: choice
        options:
          - high
          - medium

jobs:
  download-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver
        echo "CHROME_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV
        echo "CHROMEDRIVER_PATH=/usr/bin/chromedriver" >> $GITHUB_ENV
    
    - name: Install Python dependencies
      run: |
        pip install selenium requests webdriver-manager
    
    - name: Run Google Images scraper
      env:
        SEARCH_QUERY: ${{ github.event.inputs.search_query }}
        NUM_IMAGES: ${{ github.event.inputs.num_images }}
        QUALITY: ${{ github.event.inputs.quality }}
      run: |
        python google_images_downloader.py "$SEARCH_QUERY" "$NUM_IMAGES" "$QUALITY"
    
    - name: Upload images as artifact
      uses: actions/upload-artifact@v4
      with:
        name: google-images-${{ github.event.inputs.search_query }}
        path: downloads/*.zip
        retention-days: 7
        if-no-files-found: error
    
    - name: Commit and push (optional - برای ذخیره در ریپازیتوری)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if [ -d "downloads" ] && [ "$(ls -A downloads)" ]; then
          git add downloads/
          git commit -m "Add downloaded images for: ${{ github.event.inputs.search_query }}" || echo "No changes to commit"
          git push || echo "Push skipped - no changes or permission issue"
        else
          echo "No files to commit"
        fi
