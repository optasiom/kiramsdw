name: Google Images Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو (مثال: "cat" یا "mountain")'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string
      quality:
        description: 'کیفیت تصاویر (high/medium)'
        required: false
        default: 'high'
        type: choice
        options:
          - high
          - medium

jobs:
  download-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Chrome and ChromeDriver
      run: |
        # نصب Google Chrome
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # نصب ChromeDriver
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
        CHROME_MAJOR_VERSION=${CHROME_VERSION%.*}
        wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
        unzip -q chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        sudo chmod +x /usr/local/bin/chromedriver
        
        # نمایش نسخه‌ها برای اطمینان
        google-chrome --version
        chromedriver --version
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install selenium requests
    
    - name: Run Google Images scraper
      env:
        SEARCH_QUERY: ${{ github.event.inputs.search_query }}
        NUM_IMAGES: ${{ github.event.inputs.num_images }}
        QUALITY: ${{ github.event.inputs.quality }}
      run: |
        python google_images_downloader.py "$SEARCH_QUERY" "$NUM_IMAGES" "$QUALITY"
    
    - name: Upload images as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: google-images-${{ github.event.inputs.search_query }}-${{ github.run_number }}
        path: downloads/*.zip
        retention-days: 7
        if-no-files-found: warn
    
    - name: Commit and push to repository
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add downloads/*.zip downloads/*.txt 2>/dev/null || true
        git commit -m "Add downloaded images for: ${{ github.event.inputs.search_query }}" || echo "No new images to commit"
        git push || echo "Push skipped"
