name: Bing Image Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string
      quality:
        description: 'کیفیت تصاویر (high/medium)'
        required: false
        default: 'high'
        type: choice
        options:
          - high
          - medium

jobs:
  download-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install bing-image-downloader-ext
    
    - name: Run Bing image downloader
      env:
        SEARCH_QUERY: ${{ github.event.inputs.search_query }}
        NUM_IMAGES: ${{ github.event.inputs.num_images }}
        QUALITY: ${{ github.event.inputs.quality }}
      run: |
        python google_images_downloader.py "$SEARCH_QUERY" "$NUM_IMAGES" "$QUALITY"
    
    - name: Upload images as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bing-images-${{ github.event.inputs.search_query }}-${{ github.run_number }}
        path: downloads/*.zip
        retention-days: 7
        if-no-files-found: warn
