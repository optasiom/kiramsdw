name: Bing Image Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string

jobs:
  download-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install BBID (Bulk Bing Image Downloader)
      run: |
        pip install --upgrade pip
        pip install bbid
    
    - name: Run image downloader
      run: |
        python google_images_downloader.py "${{ github.event.inputs.search_query }}" "${{ github.event.inputs.num_images }}"
    
    - name: Commit and push to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add images/ downloads/ 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Add images for: ${{ github.event.inputs.search_query }} [skip ci]"
          git push
        fi
