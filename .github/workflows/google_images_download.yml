name: Google Images Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Firefox
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox
        which firefox
        firefox --version
    
    - name: Install Geckodriver
      run: |
        # دانلود مستقیم آخرین نسخه geckodriver
        GECKO_VERSION=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
        echo "Downloading geckodriver version: $GECKO_VERSION"
        wget -q "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VERSION}/geckodriver-${GECKO_VERSION}-linux64.tar.gz"
        tar -xzf geckodriver-${GECKO_VERSION}-linux64.tar.gz
        chmod +x geckodriver
        sudo mv geckodriver /usr/local/bin/
        geckodriver --version
    
    - name: Install Python dependencies
      run: |
        pip install selenium
    
    - name: Create download directory
      run: |
        mkdir -p dataset
    
    - name: Run Google Images scraper
      run: |
        python google_images_downloader.py "${{ github.event.inputs.search_query }}" "${{ github.event.inputs.num_images }}"
    
    - name: Commit and push downloaded images
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add dataset/ 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Add Google Images for: ${{ github.event.inputs.search_query }} [skip ci]"
          git push
        else
          echo "No new images to commit"
        fi
