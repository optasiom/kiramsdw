name: Google Images Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو'
        required: true
        type: string
      num_images:
        description: 'تعداد تصاویر مورد نظر'
        required: true
        default: '50'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Firefox and Geckodriver
      run: |
        # نصب Firefox
        sudo apt-get update
        sudo apt-get install -y firefox
        
        # دانلود و نصب Geckodriver
        GECKO_VERSION=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep tag_name | cut -d '"' -f 4)
        wget -q "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VERSION}/geckodriver-${GECKO_VERSION}-linux64.tar.gz"
        tar -xzf geckodriver-${GECKO_VERSION}-linux64.tar.gz
        sudo mv geckodriver /usr/local/bin/
        chmod +x /usr/local/bin/geckodriver
        
        # نمایش نسخه‌ها برای اطمینان
        firefox --version
        geckodriver --version
    
    - name: Install Python dependencies
      run: |
        pip install selenium
    
    - name: Create download directory
      run: |
        mkdir -p dataset
    
    - name: Run Google Images scraper
      run: |
        python google_images_downloader.py "${{ github.event.inputs.search_query }}" "${{ github.event.inputs.num_images }}"
    
    - name: Commit and push downloaded images
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # اضافه کردن تصاویر دانلود شده
        git add dataset/ 2>/dev/null || true
        
        # اگر تغییری وجود داشت، commit و push کن
        if ! git diff --cached --quiet; then
          git commit -m "Add Google Images for: ${{ github.event.inputs.search_query }} [skip ci]"
          git push
          echo "✅ تصاویر با موفقیت به ریپازیتوری اضافه شدند"
        else
          echo "ℹ️ هیچ تصویر جدیدی برای commit وجود ندارد"
        fi
    
    - name: Upload dataset as artifact (اختیاری)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: google-images-${{ github.event.inputs.search_query }}-${{ github.run_number }}
        path: dataset/
        retention-days: 7
        if-no-files-found: warn
