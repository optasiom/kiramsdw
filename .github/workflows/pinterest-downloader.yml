name: Pinterest Image Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search term (e.g., kagamine len)'
        required: true
        default: 'kagamine len'
        type: string
      max_results:
        description: 'Number of images'
        required: true
        default: 50
        type: number

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install requests

      - name: 🚀 Download Pinterest Images
        run: |
          cat > downloader.py << 'EOF'
          import requests
          import json
          import time
          import random
          import os
          import re
          from urllib.parse import quote
          
          SEARCH = "${{ github.event.inputs.search_query }}"
          MAX_RESULTS = int("${{ github.event.inputs.max_results }}")
          DOWNLOAD_DIR = "downloads"
          
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)
          
          print("="*50)
          print(f"Searching: {SEARCH}")
          print(f"Target: {MAX_RESULTS} images")
          print("="*50)
          
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/javascript, */*; q=0.01',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': 'https://www.pinterest.com/',
              'Origin': 'https://www.pinterest.com',
          })
          
          # Get initial cookie
          print("Getting session...")
          session.get('https://www.pinterest.com/', timeout=30)
          
          images = []
          bookmark = ""
          page = 0
          
          while len(images) < MAX_RESULTS and page < 20:
              page += 1
              print(f"Page {page}...")
              
              data = {
                  "options": {
                      "query": SEARCH,
                      "bookmarks": [bookmark] if bookmark else [],
                      "page_size": min(50, MAX_RESULTS - len(images))
                  }
              }
              
              params = {
                  "source_url": f"/search/pins/?q={quote(SEARCH)}",
                  "data": json.dumps(data)
              }
              
              time.sleep(random.uniform(1, 2))
              
              try:
                  resp = session.get(
                      "https://www.pinterest.com/resource/BaseSearchResource/get/",
                      params=params,
                      timeout=30
                  )
                  
                  if resp.status_code == 429:
                      print("Rate limit, waiting...")
                      time.sleep(30)
                      continue
                  
                  if resp.status_code != 200:
                      print(f"HTTP {resp.status_code}")
                      break
                  
                  result = resp.json()
                  pins = result.get("resource_response", {}).get("data", {}).get("results", [])
                  
                  if not pins:
                      print("No more results")
                      break
                  
                  for pin in pins:
                      img_data = pin.get("images", {})
                      img_url = None
                      
                      # Get best quality
                      for quality in ["originals", "736x", "564x"]:
                          if quality in img_data:
                              img_url = img_data[quality].get("url")
                              if img_url:
                                  break
                      
                      if img_url:
                          images.append({
                              "url": img_url,
                              "id": pin.get("id", str(len(images))),
                              "title": pin.get("title", f"img_{len(images)}")[:40]
                          })
                          print(f"  Found: {len(images)}/{MAX_RESULTS}")
                          
                          if len(images) >= MAX_RESULTS:
                              break
                  
                  bookmark = result.get("resource_response", {}).get("bookmark", "")
                  if not bookmark:
                      break
                      
              except Exception as e:
                  print(f"Error: {e}")
                  break
          
          print(f"\nFound {len(images)} images. Downloading...")
          
          downloaded = 0
          for idx, img in enumerate(images, 1):
              try:
                  filename = f"{DOWNLOAD_DIR}/{idx:04d}_{re.sub(r'[^\\w\\s-]', '', img['title'])[:30]}.jpg"
                  filename = re.sub(r'[<>:"/\\\\|?*]', '_', filename)
                  
                  resp = session.get(img['url'], timeout=30)
                  if resp.status_code == 200 and len(resp.content) > 5000:
                      with open(filename, 'wb') as f:
                          f.write(resp.content)
                      downloaded += 1
                      print(f"✅ [{idx}/{len(images)}] Downloaded ({len(resp.content)//1024}KB)")
                  else:
                      print(f"❌ [{idx}/{len(images)}] Failed")
                  
                  time.sleep(0.5)
                  
              except Exception as e:
                  print(f"❌ [{idx}] Error: {str(e)[:50]}")
          
          print(f"\n{'='*50}")
          print(f"Complete! Downloaded {downloaded}/{len(images)} images")
          print(f"Saved in: {DOWNLOAD_DIR}/")
          print(f"{'='*50}")
          EOF
          
          python downloader.py

      - name: 📦 Create ZIP
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads | grep -E '\.jpg$')" ]; then
            ZIP_NAME="pinterest_$(date +'%Y%m%d_%H%M%S').zip"
            zip -r "$ZIP_NAME" downloads/
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
            IMG_COUNT=$(ls downloads/*.jpg 2>/dev/null | wc -l)
            echo "✅ Created ZIP with $IMG_COUNT images"
          else
            ZIP_NAME="empty_$(date +'%Y%m%d_%H%M%S').zip"
            echo "No images found for '${{ github.event.inputs.search_query }}'" > result.txt
            zip "$ZIP_NAME" result.txt
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
            echo "⚠️ No images were found"
          fi

      - name: 💾 Push to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "${{ env.ZIP_NAME }}" || true
          git diff --staged --quiet || git commit -m "📸 Pinterest: ${{ github.event.inputs.search_query }}"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: 📊 Summary
        run: |
          IMG_COUNT=$(ls downloads/*.jpg 2>/dev/null | wc -l)
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 Pinterest Download Results
          
          | آیتم | مقدار |
          |------|-------|
          | 🔍 جستجو | ${{ github.event.inputs.search_query }} |
          | 🖼️ تصاویر دانلود شده | $IMG_COUNT |
          | 📦 فایل ZIP | [${{ env.ZIP_NAME }}](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${{ env.ZIP_NAME }}) |
          
          **📥 دانلود:** روی لینک کلیک کنید → Download raw file
          EOF
