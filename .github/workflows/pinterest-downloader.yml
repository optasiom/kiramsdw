name: Pinterest Chrome Downloader - Final Working Version

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search term (e.g., kagamine len)'
        required: true
        default: 'kagamine len'
        type: string
      max_results:
        description: 'Number of images'
        required: true
        default: 20
        type: number
      scrolls:
        description: 'Number of scrolls'
        required: true
        default: 5
        type: number

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install Chrome and ChromeDriver
        run: |
          # نصب Google Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # نصب ChromeDriver با نسخه مناسب
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          echo "Chrome version: $CHROME_VERSION"
          
          # دانلود ChromeDriver متناسب با Chrome
          wget "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/134.0.6998.88/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          
          # بررسی نصب
          chromedriver --version
          google-chrome --version

      - name: 📦 Install Python dependencies
        run: |
          pip install selenium webdriver-manager requests beautifulsoup4

      - name: 🚀 Create and Run Pinterest Scraper
        run: |
          cat > pinterest_scraper.py << 'EOF'
          import os
          import time
          import json
          import requests
          from urllib.parse import quote_plus
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from concurrent.futures import ThreadPoolExecutor
          
          SEARCH_TERM = "${{ github.event.inputs.search_query }}"
          MAX_IMAGES = int("${{ github.event.inputs.max_results }}")
          NUM_SCROLLS = int("${{ github.event.inputs.scrolls }}")
          DOWNLOAD_FOLDER = "downloads"
          
          print("="*60)
          print(f"🎨 Pinterest Chrome Scraper")
          print(f"🔍 Search: {SEARCH_TERM}")
          print(f"🎯 Target: {MAX_IMAGES} images")
          print(f"📄 Scrolls: {NUM_SCROLLS}")
          print("="*60)
          
          # تنظیمات Chrome
          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-blink-features=AutomationControlled")
          options.add_experimental_option("excludeSwitches", ["enable-automation"])
          options.add_experimental_option("useAutomationExtension", False)
          
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"
          options.add_argument(f"--user-agent={user_agent}")
          
          print("🔧 Launching Chrome...")
          service = Service('/usr/local/bin/chromedriver')
          browser = webdriver.Chrome(service=service, options=options)
          
          # جستجو
          search_url = f"https://www.pinterest.com/search/pins/?q={quote_plus(SEARCH_TERM)}&rs=typed"
          print(f"🌐 Opening: {search_url}")
          browser.get(search_url)
          time.sleep(3)
          
          image_urls = set()
          
          # اسکرول و استخراج
          print(f"\n📸 Scrolling and extracting images...")
          last_height = browser.execute_script("return document.body.scrollHeight")
          
          for scroll in range(NUM_SCROLLS):
              # اسکرول
              browser.execute_script("window.scrollBy(0, window.innerHeight);")
              time.sleep(2)
              
              # استخراج تصاویر
              script = """
              var urls = [];
              var images = document.querySelectorAll('img[src*="i.pinimg.com"]');
              images.forEach(function(img) {
                  if (img.src && img.src.includes('i.pinimg.com')) {
                      var url = img.src;
                      if (url.includes('/236x/')) url = url.replace('/236x/', '/originals/');
                      if (url.includes('/474x/')) url = url.replace('/474x/', '/originals/');
                      if (url.includes('/736x/')) url = url.replace('/736x/', '/originals/');
                      urls.push(url);
                  }
              });
              return urls;
              """
              
              new_urls = browser.execute_script(script)
              before_count = len(image_urls)
              image_urls.update(new_urls)
              new_found = len(image_urls) - before_count
              
              print(f"  Scroll {scroll+1}/{NUM_SCROLLS}: +{new_found} new (total: {len(image_urls)})")
              
              if len(image_urls) >= MAX_IMAGES:
                  print(f"\n✅ Reached target of {MAX_IMAGES} images!")
                  break
              
              # بررسی انتهای صفحه
              new_height = browser.execute_script("return document.body.scrollHeight")
              if new_height == last_height:
                  print(f"  📍 Reached bottom of page")
                  break
              last_height = new_height
          
          browser.quit()
          
          image_list = list(image_urls)[:MAX_IMAGES]
          print(f"\n📸 Found {len(image_list)} unique image URLs")
          
          if not image_list:
              print("❌ No images found!")
              exit(1)
          
          # دانلود تصاویر
          print(f"\n🚀 Downloading {len(image_list)} images...")
          os.makedirs(DOWNLOAD_FOLDER, exist_ok=True)
          
          def download_image(url, idx):
              try:
                  headers = {'User-Agent': user_agent}
                  response = requests.get(url, headers=headers, timeout=30)
                  if response.status_code == 200 and len(response.content) > 5000:
                      ext = url.split('.')[-1].split('?')[0]
                      if ext not in ['jpg', 'png', 'jpeg', 'webp']:
                          ext = 'jpg'
                      filename = f"{idx:04d}.{ext}"
                      filepath = os.path.join(DOWNLOAD_FOLDER, filename)
                      with open(filepath, 'wb') as f:
                          f.write(response.content)
                      size_kb = len(response.content) / 1024
                      print(f"✅ [{idx}/{len(image_list)}] {size_kb:.0f}KB")
                      return True
                  return False
              except Exception as e:
                  print(f"❌ [{idx}/{len(image_list)}] Failed: {str(e)[:40]}")
                  return False
          
          downloaded = 0
          with ThreadPoolExecutor(max_workers=5) as executor:
              futures = [executor.submit(download_image, url, i+1) for i, url in enumerate(image_list)]
              for future in futures:
                  if future.result():
                      downloaded += 1
          
          # ذخیره متادیتا
          with open(os.path.join(DOWNLOAD_FOLDER, "metadata.json"), "w") as f:
              json.dump({
                  "query": SEARCH_TERM,
                  "total_found": len(image_list),
                  "downloaded": downloaded,
                  "date": time.strftime("%Y-%m-%d %H:%M:%S")
              }, f, indent=2)
          
          print(f"\n{'='*60}")
          print(f"🎉 Complete!")
          print(f"✅ Downloaded: {downloaded}/{len(image_list)} images")
          print(f"📁 Location: {DOWNLOAD_FOLDER}/")
          print(f"{'='*60}")
          EOF
          
          python pinterest_scraper.py

      - name: 📦 Create ZIP
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads | grep -E '\.(jpg|png|jpeg)$')" ]; then
            ZIP_NAME="pinterest_$(date +'%Y%m%d_%H%M%S').zip"
            zip -r "$ZIP_NAME" downloads/
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
            IMG_COUNT=$(find downloads -name "*.jpg" -o -name "*.png" | wc -l)
            echo "✅ Created $ZIP_NAME with $IMG_COUNT images"
          else
            ZIP_NAME="empty_$(date +'%Y%m%d_%H%M%S').zip"
            echo "No images found for '${{ github.event.inputs.search_query }}'" > result.txt
            zip "$ZIP_NAME" result.txt
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          fi

      - name: 💾 Push to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "${{ env.ZIP_NAME }}" || true
          git add downloads/ || true
          git diff --staged --quiet || git commit -m "📸 Pinterest: ${{ github.event.inputs.search_query }} (Chrome)"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: 📊 Summary
        run: |
          IMG_COUNT=$(find downloads -name "*.jpg" 2>/dev/null | wc -l)
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 Pinterest Download Results (Chrome)
          
          | آیتم | مقدار |
          |------|-------|
          | 🔍 جستجو | ${{ github.event.inputs.search_query }} |
          | 🖼️ تصاویر دانلود شده | $IMG_COUNT |
          | 📦 فایل ZIP | [${{ env.ZIP_NAME }}](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${{ env.ZIP_NAME }}) |
          
          **📥 دانلود:** روی لینک کلیک کنید → راست کلیک → Save Link As
          EOF
