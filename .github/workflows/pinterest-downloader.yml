name: Pinterest Chrome Downloader - Version Fixed

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search term (e.g., kagamine len)'
        required: true
        default: 'kagamine len'
        type: string
      max_results:
        description: 'Number of images'
        required: true
        default: 20
        type: number
      scrolls:
        description: 'Number of scrolls'
        required: true
        default: 5
        type: number

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          
          wget "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" || \
          wget "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_MAJOR_VERSION}.0.0.0/linux64/chromedriver-linux64.zip" || \
          wget "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/134.0.6998.88/linux64/chromedriver-linux64.zip"
          
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/ || sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: 📦 Install Python dependencies
        run: |
          pip install selenium requests

      - name: 🚀 Run Pinterest Scraper
        run: |
          cat > pinterest_final.py << 'EOF'
          import os
          import time
          import json
          import requests
          import zipfile
          from urllib.parse import quote_plus
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from concurrent.futures import ThreadPoolExecutor
          
          SEARCH_TERM = "${{ github.event.inputs.search_query }}"
          MAX_IMAGES = int("${{ github.event.inputs.max_results }}")
          NUM_SCROLLS = int("${{ github.event.inputs.scrolls }}")
          DOWNLOAD_FOLDER = "downloads"
          MAX_ZIP_SIZE = 90 * 1024 * 1024  # 90 MB (safe margin)
          
          print("="*60)
          print(f"🎨 Pinterest Scraper")
          print(f"🔍 Search: {SEARCH_TERM}")
          print("="*60)
          
          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-blink-features=AutomationControlled")
          
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          options.add_argument(f"--user-agent={user_agent}")
          
          service = Service('/usr/local/bin/chromedriver')
          browser = webdriver.Chrome(service=service, options=options)
          
          search_url = f"https://www.pinterest.com/search/pins/?q={quote_plus(SEARCH_TERM)}"
          browser.get(search_url)
          time.sleep(5)
          
          image_urls = set()
          scroll_count = 0
          
          while len(image_urls) < MAX_IMAGES and scroll_count < NUM_SCROLLS:
              scroll_count += 1
              script = """
              var urls = [];
              var images = document.querySelectorAll('img[src*="i.pinimg.com"]');
              images.forEach(function(img) {
                  if (img.src) {
                      var url = img.src;
                      if (url.includes('/236x/')) url = url.replace('/236x/', '/originals/');
                      if (url.includes('/474x/')) url = url.replace('/474x/', '/originals/');
                      if (url.includes('/736x/')) url = url.replace('/736x/', '/originals/');
                      urls.push(url);
                  }
              });
              return urls;
              """
              new_urls = browser.execute_script(script)
              image_urls.update(new_urls)
              print(f"  Scroll {scroll_count}: total {len(image_urls)}")
              if len(image_urls) >= MAX_IMAGES:
                  break
              browser.execute_script("window.scrollTo(0, document.body.scrollHeight);")
              time.sleep(3)
          
          browser.quit()
          image_list = list(image_urls)[:MAX_IMAGES]
          print(f"\n📸 Found {len(image_list)} images")
          
          if not image_list:
              print("❌ No images found!")
              exit(1)
          
          os.makedirs(DOWNLOAD_FOLDER, exist_ok=True)
          downloaded_files = []
          file_sizes = []
          
          def download_img(url, idx):
              try:
                  headers = {'User-Agent': user_agent}
                  r = requests.get(url, headers=headers, timeout=30)
                  if r.status_code == 200 and len(r.content) > 5000:
                      ext = url.split('.')[-1].split('?')[0]
                      if ext not in ['jpg', 'png', 'jpeg', 'webp']:
                          ext = 'jpg'
                      path = os.path.join(DOWNLOAD_FOLDER, f"{idx:04d}.{ext}")
                      with open(path, 'wb') as f:
                          f.write(r.content)
                      print(f"✅ [{idx}] {len(r.content)//1024}KB")
                      return path, len(r.content)
                  return None, 0
              except Exception as e:
                  print(f"❌ [{idx}] {str(e)[:30]}")
                  return None, 0
          
          with ThreadPoolExecutor(max_workers=5) as ex:
              futures = [ex.submit(download_img, url, i+1) for i, url in enumerate(image_list)]
              for future in futures:
                  path, size = future.result()
                  if path:
                      downloaded_files.append(path)
                      file_sizes.append(size)
          
          print(f"\n✅ Downloaded: {len(downloaded_files)} files")
          
          # Create ZIP files
          zip_files = []
          current_idx = 1
          current_zip = zipfile.ZipFile(f"pinterest_part{current_idx}.zip", 'w', zipfile.ZIP_DEFLATED)
          current_size = 0
          
          for file_path, file_size in zip(downloaded_files, file_sizes):
              if current_size + file_size > MAX_ZIP_SIZE and current_size > 0:
                  current_zip.close()
                  zip_files.append(f"pinterest_part{current_idx}.zip")
                  current_idx += 1
                  current_zip = zipfile.ZipFile(f"pinterest_part{current_idx}.zip", 'w', zipfile.ZIP_DEFLATED)
                  current_size = 0
              
              current_zip.write(file_path, os.path.basename(file_path))
              current_size += file_size
          
          current_zip.close()
          zip_files.append(f"pinterest_part{current_idx}.zip")
          
          # Save metadata
          with open("metadata.json", "w") as f:
              json.dump({
                  "query": SEARCH_TERM,
                  "downloaded": len(downloaded_files),
                  "zip_files": zip_files,
                  "total_size_mb": sum(file_sizes) / (1024*1024)
              }, f)
          
          # Also save list for GitHub Actions
          with open("zip_list.txt", "w") as f:
              for zf in zip_files:
                  f.write(f"{zf}\n")
          
          print(f"\n📦 Created {len(zip_files)} ZIP file(s):")
          for zf in zip_files:
              size_mb = os.path.getsize(zf) / (1024*1024)
              print(f"   {zf} ({size_mb:.1f}MB)")
          EOF
          
          python pinterest_final.py

      - name: 📤 Upload ZIP files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-images-${{ github.event.inputs.search_query }}
          path: |
            *.zip
            metadata.json
          retention-days: 7
          if-no-files-found: warn

      - name: 🔄 Upload to Release (using API)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a tag and release
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          TAG_NAME="pinterest_${TIMESTAMP}"
          RELEASE_NAME="📸 Pinterest: ${{ github.event.inputs.search_query }} (${TIMESTAMP})"
          
          echo "Creating release: $TAG_NAME"
          
          # Create release using GitHub API
          CREATE_RELEASE_RESPONSE=$(curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/releases \
            -d "{
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"${RELEASE_NAME}\",
              \"body\": \"Downloaded images for: ${{ github.event.inputs.search_query }}\nTotal files: $(cat metadata.json | jq -r .downloaded 2>/dev/null || echo 'unknown')\",
              \"draft\": false,
              \"prerelease\": false
            }")
          
          # Extract upload URL
          UPLOAD_URL=$(echo "$CREATE_RELEASE_RESPONSE" | jq -r .upload_url | cut -d'{' -f1)
          echo "Upload URL: $UPLOAD_URL"
          
          # Upload each ZIP file
          if [ -f "zip_list.txt" ]; then
            while IFS= read -r zip_file; do
              if [ -f "$zip_file" ]; then
                echo "Uploading: $zip_file"
                FILE_SIZE=$(stat -c%s "$zip_file")
                
                curl -L \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Content-Type: application/zip" \
                  -H "Content-Length: ${FILE_SIZE}" \
                  --data-binary @"${zip_file}" \
                  "${UPLOAD_URL}?name=$(basename "${zip_file}")"
                
                echo "✅ Uploaded: $zip_file"
              fi
            done < zip_list.txt
          fi
          
          # Also upload metadata
          if [ -f "metadata.json" ]; then
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @"metadata.json" \
              "${UPLOAD_URL}?name=metadata.json"
          fi
          
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV

      - name: 📊 Summary
        run: |
          echo "## 🎨 Pinterest Download Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Search Term:** ${{ github.event.inputs.search_query }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "metadata.json" ]; then
            DOWNLOADED=$(jq -r .downloaded metadata.json 2>/dev/null || echo "0")
            TOTAL_SIZE=$(jq -r .total_size_mb metadata.json 2>/dev/null || echo "0")
            echo "**Images Downloaded:** $DOWNLOADED" >> $GITHUB_STEP_SUMMARY
            echo "**Total Size:** ${TOTAL_SIZE} MB" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Download Options:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. **GitHub Release**: Check the [Releases](https://github.com/${GITHUB_REPOSITORY}/releases) section" >> $GITHUB_STEP_SUMMARY
            echo "2. **Workflow Artifacts**: Go to Actions → This workflow → Artifacts" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "zip_list.txt" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📁 ZIP Files:" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r zip_file; do
              if [ -f "$zip_file" ]; then
                SIZE=$(du -h "$zip_file" | cut -f1)
                echo "- \`$zip_file\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
              fi
            done < zip_list.txt
          fi

      - name: 📝 Commit metadata
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add metadata.json zip_list.txt *.zip 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📸 Pinterest download: ${{ github.event.inputs.search_query }}"
          git push origin HEAD:${{ github.ref_name }} || echo "Push skipped (no changes or permissions)"
