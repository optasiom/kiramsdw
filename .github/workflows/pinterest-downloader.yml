name: Pinterest Downloader - Working Version

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query (e.g., kagamine len)'
        required: true
        default: 'kagamine len'
        type: string
      max_results:
        description: 'Number of images'
        required: true
        default: 20
        type: number

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          pip install requests
          pip install fake-useragent
          pip install termcolor
          pip install colorama
          pip install lxml

      - name: 🔧 Download Pinterest Downloader Script
        run: |
          # دانلود اسکریپت اصلی از GitHub
          wget https://raw.githubusercontent.com/limkokhole/pinterest-downloader/master/pinterest-downloader.py
          
          # یا اگر فایل محلی دارید، از آن استفاده کنید
          # cat > pinterest-downloader.py << 'EOF'
          # [محتوای فایل pinterest-downloader.py شما]
          # EOF

      - name: 🚀 Run Pinterest Downloader
        run: |
          # ایجاد پوشه خروجی
          mkdir -p downloads
          
          # جستجو و دانلود با استفاده از کوکی مهمان (بدون نیاز به لاگین)
          # روش 1: استفاده از جستجو با لینک مستقیم
          SEARCH_URL="https://www.pinterest.com/search/pins/?q=${{ github.event.inputs.search_query }}"
          
          python pinterest-downloader.py "$SEARCH_URL" -d downloads -j 5
          
          # اگر روش بالا کار نکرد، از روش username استفاده کن
          if [ ! "$(ls -A downloads 2>/dev/null)" ]; then
            echo "Trying alternative method..."
            python pinterest-downloader.py "${{ github.event.inputs.search_query }}" -d downloads -j 5
          fi

      - name: 📦 Create ZIP Archive
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads | grep -E '\.(jpg|png|mp4)$')" ]; then
            ZIP_NAME="pinterest_$(date +'%Y%m%d_%H%M%S').zip"
            zip -r "$ZIP_NAME" downloads/
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
            echo "✅ Created $ZIP_NAME"
          else
            echo "⚠️ No images downloaded, creating placeholder"
            ZIP_NAME="empty_$(date +'%Y%m%d_%H%M%S').zip"
            echo "No images found for '${{ github.event.inputs.search_query }}'" > result.txt
            zip "$ZIP_NAME" result.txt
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          fi

      - name: 💾 Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "${{ env.ZIP_NAME }}" || true
          git add downloads/ || true
          git diff --staged --quiet || git commit -m "📸 Pinterest: ${{ github.event.inputs.search_query }} (${GITHUB_RUN_ID})"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: 📊 Summary
        run: |
          IMG_COUNT=$(find downloads -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.mp4" \) 2>/dev/null | wc -l)
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 Pinterest Download Results
          
          | آیتم | مقدار |
          |------|-------|
          | 🔍 جستجو | ${{ github.event.inputs.search_query }} |
          | 🖼️ تعداد فایل‌ها | $IMG_COUNT |
          | 📦 فایل ZIP | [${{ env.ZIP_NAME }}](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${{ env.ZIP_NAME }}) |
          
          **📥 دانلود:** روی لینک بالا کلیک کنید و سپس دکمه Download را بزنید.
          EOF
