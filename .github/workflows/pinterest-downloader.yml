name: Pinterest Selenium Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query (e.g., kagamine len)'
        required: true
        default: 'kagamine len'
        type: string
      max_results:
        description: 'Number of images'
        required: true
        default: 20
        type: number

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install Firefox and Geckodriver
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox
          wget https://github.com/mozilla/geckodriver/releases/download/v0.34.0/geckodriver-v0.34.0-linux64.tar.gz
          tar -xzf geckodriver-v0.34.0-linux64.tar.gz
          sudo mv geckodriver /usr/local/bin/
          chmod +x /usr/local/bin/geckodriver

      - name: 📦 Install Python dependencies
        run: |
          pip install selenium beautifulsoup4 pillow

      - name: 🚀 Run Pinterest Downloader
        run: |
          cat > pinterest_selenium_downloader.py << 'EOF'
          #! /usr/bin/env python
          
          import concurrent.futures
          from datetime import datetime
          import os
          from time import sleep
          import urllib.request
          import re
          
          from bs4 import BeautifulSoup
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.firefox.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          
          import logging
          
          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger(__name__)
          
          SEARCH_QUERY = "${{ github.event.inputs.search_query }}"
          MAX_RESULTS = int("${{ github.event.inputs.max_results }}")
          DOWNLOAD_FOLDER = "downloads"
          
          class PinterestDownloader:
              def __init__(self, num_threads=4):
                  self.num_threads = num_threads
                  self.browser = None
              
              def __enter__(self):
                  options = Options()
                  options.add_argument("--headless")
                  options.add_argument("--no-sandbox")
                  options.add_argument("--disable-dev-shm-usage")
                  options.add_argument("--disable-gpu")
                  options.add_argument("--window-size=1920,1080")
                  self.browser = webdriver.Firefox(options=options)
                  return self
              
              def __exit__(self, exc_type, exc_value, traceback):
                  if self.browser:
                      self.browser.quit()
              
              def search_pinterest(self, query, max_results):
                  """جستجو در پینترست و استخراج لینک تصاویر"""
                  
                  # ساخت URL جستجو
                  search_url = f"https://www.pinterest.com/search/pins/?q={query.replace(' ', '%20')}"
                  logger.info(f"Opening: {search_url}")
                  self.browser.get(search_url)
                  
                  # منتظر بارگذاری صفحه
                  sleep(3)
                  
                  images = []
                  last_height = 0
                  scroll_attempts = 0
                  
                  while len(images) < max_results and scroll_attempts < 30:
                      # استخراج لینک‌های تصاویر
                      soup = BeautifulSoup(self.browser.page_source, 'html.parser')
                      img_elements = soup.find_all('img')
                      
                      for img in img_elements:
                          src = img.get('src', '')
                          # فیلتر کردن لینک‌های معتبر
                          if src and 'pinimg.com' in src and src not in [i['url'] for i in images]:
                              # تبدیل به لینک با کیفیت بالا
                              high_res_url = src.replace('/236x/', '/736x/').replace('/564x/', '/originals/')
                              
                              # استخراج نام فایل
                              filename = re.sub(r'[^\w\-_.]', '_', src.split('/')[-1].split('?')[0])
                              if not filename.endswith(('.jpg', '.png', '.jpeg')):
                                  filename += '.jpg'
                              
                              images.append({
                                  'url': high_res_url,
                                  'filename': filename,
                                  'id': len(images) + 1
                              })
                              
                              logger.info(f"Found image {len(images)}/{max_results}")
                              
                              if len(images) >= max_results:
                                  break
                      
                      # اسکرول به پایین برای بارگذاری بیشتر
                      self.browser.execute_script("window.scrollTo(0, document.body.scrollHeight);")
                      sleep(2)
                      
                      # بررسی تغییر ارتفاع
                      new_height = self.browser.execute_script("return document.body.scrollHeight")
                      if new_height == last_height:
                          scroll_attempts += 1
                      else:
                          scroll_attempts = 0
                      last_height = new_height
                      
                      logger.info(f"Scrolling... Found {len(images)} images so far")
                  
                  return images[:max_results]
              
              def download_images(self, images):
                  """دانلود تصاویر با threading"""
                  
                  os.makedirs(DOWNLOAD_FOLDER, exist_ok=True)
                  
                  def download_single(img):
                      try:
                          filepath = os.path.join(DOWNLOAD_FOLDER, f"{img['id']:04d}_{img['filename']}")
                          
                          # اضافه کردن هدر User-Agent
                          req = urllib.request.Request(img['url'], headers={
                              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                          })
                          
                          urllib.request.urlretrieve(req, filepath)
                          
                          # بررسی کیفیت
                          with Image.open(filepath) as img_file:
                              width, height = img_file.size
                              size_kb = os.path.getsize(filepath) / 1024
                              
                          logger.info(f"✅ Downloaded: {img['filename']} ({width}x{height}, {size_kb:.0f}KB)")
                          return True
                          
                      except Exception as e:
                          logger.error(f"❌ Failed: {img['filename']} - {str(e)[:50]}")
                          return False
                  
                  # دانلود موازی
                  downloaded = 0
                  with concurrent.futures.ThreadPoolExecutor(max_workers=self.num_threads) as executor:
                      futures = [executor.submit(download_single, img) for img in images]
                      for future in concurrent.futures.as_completed(futures):
                          if future.result():
                              downloaded += 1
                  
                  return downloaded
          
          def main():
              print("="*60)
              print(f"🎨 Pinterest Selenium Downloader")
              print(f"🔍 Search: {SEARCH_QUERY}")
              print(f"🎯 Target: {MAX_RESULTS} images")
              print("="*60)
              
              with PinterestDownloader(num_threads=4) as downloader:
                  # جستجو و استخراج لینک‌ها
                  images = downloader.search_pinterest(SEARCH_QUERY, MAX_RESULTS)
                  
                  if not images:
                      print("❌ No images found!")
                      return 0
                  
                  print(f"\n📸 Found {len(images)} images. Starting download...\n")
                  
                  # دانلود
                  downloaded = downloader.download_images(images)
                  
                  print(f"\n{'='*60}")
                  print(f"🎉 Complete!")
                  print(f"✅ Downloaded: {downloaded}/{len(images)} images")
                  print(f"📁 Location: {DOWNLOAD_FOLDER}/")
                  print(f"{'='*60}")
                  
                  return downloaded
          
          if __name__ == "__main__":
              main()
          EOF
          
          python pinterest_selenium_downloader.py

      - name: 📦 Create ZIP
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads | grep -E '\.(jpg|png|jpeg)$')" ]; then
            ZIP_NAME="pinterest_$(date +'%Y%m%d_%H%M%S').zip"
            zip -r "$ZIP_NAME" downloads/
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
            IMG_COUNT=$(find downloads -name "*.jpg" -o -name "*.png" | wc -l)
            echo "✅ Created $ZIP_NAME with $IMG_COUNT images"
          else
            echo "⚠️ No images downloaded"
            ZIP_NAME="empty_$(date +'%Y%m%d_%H%M%S').zip"
            echo "No images found for '${{ github.event.inputs.search_query }}'" > result.txt
            zip "$ZIP_NAME" result.txt
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          fi

      - name: 💾 Push to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "${{ env.ZIP_NAME }}" || true
          git add downloads/ || true
          git diff --staged --quiet || git commit -m "📸 Pinterest: ${{ github.event.inputs.search_query }} (Selenium)"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: 📊 Summary
        run: |
          IMG_COUNT=$(find downloads -name "*.jpg" -o -name "*.png" 2>/dev/null | wc -l)
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 Pinterest Download Results (Selenium)
          
          | آیتم | مقدار |
          |------|-------|
          | 🔍 جستجو | ${{ github.event.inputs.search_query }} |
          | 🖼️ تصاویر دانلود شده | $IMG_COUNT |
          | 📦 فایل ZIP | [${{ env.ZIP_NAME }}](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${{ env.ZIP_NAME }}) |
          
          **📥 دانلود:** روی لینک کلیک کنید → راست کلیک → Save Link As
          EOF
