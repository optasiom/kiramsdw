name: Pinterest Image Downloader - Save to Repository

on:
  # اجرای دستی
  workflow_dispatch:
    inputs:
      search_query:
        description: 'عبارت جستجو در پینترست'
        required: true
        default: 'modern architecture'
        type: string
      max_results:
        description: 'تعداد عکس مورد نظر'
        required: true
        default: 50
        type: number
      image_quality:
        description: 'کیفیت تصاویر'
        required: true
        default: '736x'
        type: choice
        options:
          - '736x'
          - '564x'
      zip_filename:
        description: 'نام فایل ZIP خروجی'
        required: true
        default: 'pinterest_images.zip'
        type: string

  # اجرای برنامه‌ریزی شده هر روز
  schedule:
    - cron: '0 8 * * *'

jobs:
  download-and-save:
    runs-on: ubuntu-latest
    
    # دسترسی لازم برای push به ریپازیتوری
    permissions:
      contents: write
    
    steps:
      # 1. Checkout مخزن
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # مهم: برای push بعدی نیاز به توکن کامل است
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. نصب Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. نصب وابستگی‌ها
      - name: 📦 Install dependencies
        run: |
          pip install requests aiohttp aiofiles

      # 4. ایجاد اسکریپت دانلودر
      - name: 🔧 Create downloader script
        run: |
          cat > pinterest_downloader.py << 'EOF'
          # [کد کامل دانلودر که در ادامه می‌آید]
          EOF

      # 5. اجرای دانلودر
      - name: 🚀 Run Pinterest Downloader
        run: |
          python pinterest_downloader.py
        env:
          PINTEREST_SEARCH: ${{ github.event.inputs.search_query }}
          PINTEREST_MAX_RESULTS: ${{ github.event.inputs.max_results }}
          PINTEREST_QUALITY: ${{ github.event.inputs.image_quality }}

      # 6. ایجاد فایل ZIP
      - name: 📦 Create ZIP archive
        run: |
          ZIP_NAME="${{ github.event.inputs.zip_filename || 'pinterest_images.zip' }}"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          
          # ایجاد ZIP از پوشه دانلودها
          zip -r "$ZIP_NAME" downloads/ -x "*.DS_Store"
          
          # ایجاد فایل متادیتا
          cat > download_info.txt << EOF
          Pinterest Download Information
          ================================
          Date: $(date)
          Search Query: ${{ github.event.inputs.search_query || 'modern architecture' }}
          Total Images: $(find downloads -type f -name "*.jpg" | wc -l)
          Quality: ${{ github.event.inputs.image_quality || '736x' }}
          Repository: ${{ github.repository }}
          Workflow Run: ${{ github.run_id }}
          EOF
          
          # اضافه کردن متادیتا به ZIP
          zip -u "$ZIP_NAME" download_info.txt
          
          # نمایش حجم فایل
          ls -lh "$ZIP_NAME"

      # 7. ذخیره در ریپازیتوری (با تاریخ)
      - name: 💾 Save to repository with timestamp
        run: |
          # ایجاد نام فایل با زمان‌سنج
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FINAL_NAME="pinterest_${TIMESTAMP}_${{ github.event.inputs.zip_filename || 'images.zip' }}"
          
          # اگر ورودی دستی نبود از نام پیش‌فرض استفاده کن
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FINAL_NAME="pinterest_scheduled_${TIMESTAMP}.zip"
          fi
          
          # کپی فایل ZIP با نام جدید
          cp "${{ env.ZIP_NAME }}" "$FINAL_NAME"
          
          # ایجاد یا به‌روزرسانی فایل latest.zip
          cp "$FINAL_NAME" "latest_pinterest_images.zip"
          
          # حذف ZIP قدیمی (فقط 5 نسخه آخر نگهداری شود)
          ls -t pinterest_*.zip 2>/dev/null | tail -n +6 | xargs -r rm
          
          echo "FINAL_ZIP=$FINAL_NAME" >> $GITHUB_ENV
          echo "✅ ZIP created: $FINAL_NAME"

      # 8. Commit و Push به ریپازیتوری
      - name: 📤 Commit and push to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # اضافه کردن فایل‌ها
          git add "${{ env.FINAL_ZIP }}" || true
          git add "latest_pinterest_images.zip" || true
          git add download_info.txt || true
          
          # ایجاد commit message
          git commit -m "📸 Pinterest images: ${{ github.event.inputs.search_query || 'scheduled' }} (${GITHUB_RUN_ID})" || echo "No changes to commit"
          
          # Push به مخزن
          git push origin HEAD:${{ github.ref_name }}
          
          echo "✅ Files pushed to repository"

      # 9. ایجاد Summary
      - name: 📊 Generate job summary
        run: |
          TOTAL_IMAGES=$(find downloads -type f -name "*.jpg" | wc -l)
          ZIP_SIZE=$(du -h "${{ env.FINAL_ZIP }}" | cut -f1)
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 Pinterest Download Complete!
          
          | آیتم | مقدار |
          |------|-------|
          | 🔍 عبارت جستجو | ${{ github.event.inputs.search_query || 'modern architecture' }} |
          | 🖼️ تعداد تصاویر | $TOTAL_IMAGES |
          | 📦 حجم فایل ZIP | $ZIP_SIZE |
          | 💾 نام فایل | \`${{ env.FINAL_ZIP }}\` |
          | 📁 مسیر در ریپازیتوری | [دانلود فایل](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${{ env.FINAL_ZIP }}) |
          | 🔗 آخرین نسخه | \`latest_pinterest_images.zip\` |
          
          ### 📥 نحوه دانلود
          1. به ریپازیتوری خود بروید
          2. فایل \`${{ env.FINAL_ZIP }}\` را پیدا کنید
          3. روی آن کلیک کرده و **Download** را بزنید
          
          ---
          *این فایل به صورت خودکار توسط GitHub Actions تولید شده است*
          EOF

      # 10. اطلاع‌رسانی (اختیاری)
      - name: 🔔 Create issue on success (optional)
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const totalImages = fs.readdirSync('downloads').filter(f => f.endsWith('.jpg')).length;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `✅ Pinterest Download Complete: ${totalImages} images`,
              body: `تصاویر با موفقیت دانلود و در ریپازیتوری ذخیره شدند.
              
              🔍 عبارت جستجو: ${{ github.event.inputs.search_query }}
              🖼️ تعداد: ${totalImages}
              📁 فایل ZIP: \`${{ env.FINAL_ZIP }}\`
              
              برای دانلود فایل به [این لینک](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${{ env.FINAL_ZIP }}) مراجعه کنید.`
            });
