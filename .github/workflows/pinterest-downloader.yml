name: Pinterest Chrome Downloader - Version Fixed

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search term (e.g., kagamine len)'
        required: true
        default: 'kagamine len'
        type: string
      max_results:
        description: 'Number of images'
        required: true
        default: 20
        type: number
      scrolls:
        description: 'Number of scrolls'
        required: true
        default: 5
        type: number

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install Chrome and matching ChromeDriver
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "Chrome version: $CHROME_VERSION"
          
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          echo "Chrome major version: $CHROME_MAJOR_VERSION"
          
          wget "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" || \
          wget "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_MAJOR_VERSION}.0.0.0/linux64/chromedriver-linux64.zip" || \
          wget "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/134.0.6998.88/linux64/chromedriver-linux64.zip"
          
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/ || sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          
          chromedriver --version
          google-chrome --version

      - name: 📦 Install Python dependencies
        run: |
          pip install selenium webdriver-manager requests

      - name: 🚀 Run Pinterest Scraper
        run: |
          cat > pinterest_final.py << 'EOF'
          import os
          import time
          import json
          import requests
          import zipfile
          from pathlib import Path
          from urllib.parse import quote_plus
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from concurrent.futures import ThreadPoolExecutor
          
          SEARCH_TERM = "${{ github.event.inputs.search_query }}"
          MAX_IMAGES = int("${{ github.event.inputs.max_results }}")
          NUM_SCROLLS = int("${{ github.event.inputs.scrolls }}")
          DOWNLOAD_FOLDER = "downloads"
          MAX_ZIP_SIZE = 95 * 1024 * 1024  # 95 MB in bytes
          
          print("="*60)
          print(f"🎨 Pinterest Chrome Scraper")
          print(f"🔍 Search: {SEARCH_TERM}")
          print(f"🎯 Target: {MAX_IMAGES} images")
          print("="*60)
          
          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-blink-features=AutomationControlled")
          
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"
          options.add_argument(f"--user-agent={user_agent}")
          
          print("🔧 Launching Chrome...")
          service = Service('/usr/local/bin/chromedriver')
          browser = webdriver.Chrome(service=service, options=options)
          
          search_url = f"https://www.pinterest.com/search/pins/?q={quote_plus(SEARCH_TERM)}"
          print(f"🌐 Opening: {search_url}")
          browser.get(search_url)
          time.sleep(5)
          
          image_urls = set()
          scroll_count = 0
          
          print(f"\n📸 Extracting images...")
          
          while len(image_urls) < MAX_IMAGES and scroll_count < NUM_SCROLLS:
              scroll_count += 1
              
              script = """
              var urls = [];
              var images = document.querySelectorAll('img[src*="i.pinimg.com"]');
              images.forEach(function(img) {
                  if (img.src) {
                      var url = img.src;
                      if (url.includes('/236x/')) url = url.replace('/236x/', '/originals/');
                      if (url.includes('/474x/')) url = url.replace('/474x/', '/originals/');
                      if (url.includes('/736x/')) url = url.replace('/736x/', '/originals/');
                      urls.push(url);
                  }
              });
              return urls;
              """
              
              new_urls = browser.execute_script(script)
              before = len(image_urls)
              image_urls.update(new_urls)
              new_found = len(image_urls) - before
              
              print(f"  Scroll {scroll_count}: +{new_found} (total: {len(image_urls)})")
              
              if len(image_urls) >= MAX_IMAGES:
                  break
              
              browser.execute_script("window.scrollTo(0, document.body.scrollHeight);")
              time.sleep(3)
          
          browser.quit()
          
          image_list = list(image_urls)[:MAX_IMAGES]
          print(f"\n📸 Found {len(image_list)} images")
          
          if not image_list:
              print("❌ No images found!")
              exit(1)
          
          print(f"\n🚀 Downloading...")
          os.makedirs(DOWNLOAD_FOLDER, exist_ok=True)
          
          downloaded_files = []
          file_sizes = []
          
          def download_img(url, idx):
              try:
                  headers = {'User-Agent': user_agent}
                  r = requests.get(url, headers=headers, timeout=30)
                  if r.status_code == 200 and len(r.content) > 5000:
                      ext = url.split('.')[-1].split('?')[0]
                      if ext not in ['jpg', 'png', 'jpeg', 'webp']:
                          ext = 'jpg'
                      path = os.path.join(DOWNLOAD_FOLDER, f"{idx:04d}.{ext}")
                      with open(path, 'wb') as f:
                          f.write(r.content)
                      file_size = len(r.content)
                      print(f"✅ [{idx}/{len(image_list)}] {file_size//1024}KB")
                      return path, file_size
                  return None, 0
              except Exception as e:
                  print(f"❌ [{idx}] {str(e)[:30]}")
                  return None, 0
          
          with ThreadPoolExecutor(max_workers=5) as ex:
              futures = [ex.submit(download_img, url, i+1) for i, url in enumerate(image_list)]
              for future in futures:
                  path, size = future.result()
                  if path:
                      downloaded_files.append(path)
                      file_sizes.append(size)
          
          print(f"\n✅ Successfully downloaded: {len(downloaded_files)} files")
          
          # Create ZIP files with size limit
          print(f"\n📦 Creating ZIP files (max {MAX_ZIP_SIZE // (1024*1024)}MB per file)...")
          
          zip_files = []
          current_zip_idx = 1
          current_zip = zipfile.ZipFile(f"pinterest_{SEARCH_TERM[:20]}_part{current_zip_idx}.zip", 'w', zipfile.ZIP_DEFLATED)
          current_size = 0
          
          for file_path, file_size in zip(downloaded_files, file_sizes):
              if current_size + file_size > MAX_ZIP_SIZE and current_size > 0:
                  # Close current zip and start new one
                  current_zip.close()
                  zip_files.append(f"pinterest_{SEARCH_TERM[:20]}_part{current_zip_idx}.zip")
                  current_zip_idx += 1
                  current_zip = zipfile.ZipFile(f"pinterest_{SEARCH_TERM[:20]}_part{current_zip_idx}.zip", 'w', zipfile.ZIP_DEFLATED)
                  current_size = 0
              
              # Add file to current zip
              current_zip.write(file_path, os.path.basename(file_path))
              current_size += file_size
          
          # Close last zip
          if current_size > 0:
              current_zip.close()
              zip_files.append(f"pinterest_{SEARCH_TERM[:20]}_part{current_zip_idx}.zip")
          
          # Save info.json
          with open(os.path.join(DOWNLOAD_FOLDER, "info.json"), "w") as f:
              json.dump({
                  "query": SEARCH_TERM, 
                  "downloaded": len(downloaded_files), 
                  "total": len(image_list),
                  "zip_files": zip_files,
                  "total_size_mb": sum(file_sizes) / (1024*1024)
              }, f)
          
          # Also add info.json to each zip
          for zip_file in zip_files:
              with zipfile.ZipFile(zip_file, 'a') as zf:
                  zf.write(os.path.join(DOWNLOAD_FOLDER, "info.json"), "info.json")
          
          # Save list of zip files for GitHub Actions
          with open("zip_files.txt", "w") as f:
              for zf in zip_files:
                  f.write(f"{zf}\n")
          
          print(f"\n{'='*60}")
          print(f"🎉 Done! Downloaded {len(downloaded_files)} images")
          print(f"📦 Created {len(zip_files)} ZIP file(s):")
          for zf in zip_files:
              size_mb = os.path.getsize(zf) / (1024*1024)
              print(f"   - {zf} ({size_mb:.1f}MB)")
          print(f"💾 Total size: {sum(file_sizes) / (1024*1024):.1f}MB")
          print(f"{'='*60}")
          EOF
          
          python pinterest_final.py

      - name: 📤 Upload ZIP files to release
        run: |
          if [ -f "zip_files.txt" ]; then
            # Read zip files list
            while IFS= read -r zip_file; do
              if [ -f "$zip_file" ]; then
                echo "📦 Processing: $zip_file"
                
                # Create a unique tag for this run
                TAG_NAME="pinterest_$(date +'%Y%m%d_%H%M%S')_${RANDOM}"
                
                # Create a release for each zip file
                gh release create "$TAG_NAME" "$zip_file" \
                  --title "📸 Pinterest: ${{ github.event.inputs.search_query }}" \
                  --notes "Downloaded on $(date)\nSearch term: ${{ github.event.inputs.search_query }}\nFile: $zip_file" \
                  --repo ${{ github.repository }} || true
                
                echo "✅ Uploaded: $zip_file"
                sleep 2  # Avoid rate limiting
              fi
            done < zip_files.txt
            
            # Also push to branch as backup
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            
            for zip_file in $(cat zip_files.txt); do
              if [ -f "$zip_file" ]; then
                git add "$zip_file" || true
              fi
            done
            
            git add downloads/info.json || true
            git diff --staged --quiet || git commit -m "📸 Pinterest: ${{ github.event.inputs.search_query }} (${#zip_files} parts)"
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "⚠️ No zip files found to upload"
          fi

      - name: 📊 Summary
        run: |
          echo "## 🎨 Pinterest Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Search Term:** ${{ github.event.inputs.search_query }}" >> $GITHUB_STEP_SUMMARY
          echo "**Max Results:** ${{ github.event.inputs.max_results }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "zip_files.txt" ]; then
            TOTAL_SIZE=0
            FILE_COUNT=$(cat zip_files.txt | wc -l)
            echo "**ZIP Files Created:** $FILE_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            
            while IFS= read -r zip_file; do
              if [ -f "$zip_file" ]; then
                SIZE=$(du -h "$zip_file" | cut -f1)
                echo "| \`$zip_file\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
                TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$zip_file")))
              fi
            done < zip_files.txt
            
            TOTAL_MB=$((TOTAL_SIZE / 1024 / 1024))
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Download Size:** ${TOTAL_MB} MB" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Images are available in the **Releases** section and in the repository files." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No images were downloaded successfully." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup old releases (optional)
        run: |
          # Keep only last 10 releases to save space
          gh release list --limit 20 --repo ${{ github.repository }} | tail -n +11 | awk '{print $1}' | while read release; do
            echo "🗑️ Deleting old release: $release"
            gh release delete "$release" --yes --repo ${{ github.repository }} || true
          done
        continue-on-error: true
