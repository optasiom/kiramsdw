name: Pinterest Chrome Downloader - Version Fixed

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search term (e.g., kagamine len)'
        required: true
        default: 'kagamine len'
        type: string
      max_results:
        description: 'Number of images'
        required: true
        default: 20
        type: number
      scrolls:
        description: 'Number of scrolls'
        required: true
        default: 5
        type: number

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history to avoid sync issues

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install Chrome and matching ChromeDriver
        run: |
          # نصب Google Chrome آخرین نسخه
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # دریافت نسخه دقیق Chrome
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "Chrome version: $CHROME_VERSION"
          
          # استخراج نسخه اصلی (مثل 148)
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          echo "Chrome major version: $CHROME_MAJOR_VERSION"
          
          # دانلود ChromeDriver متناسب با نسخه Chrome
          # استفاده از Chrome for Testing API برای دریافت نسخه مناسب
          wget "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" || \
          wget "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_MAJOR_VERSION}.0.0.0/linux64/chromedriver-linux64.zip" || \
          wget "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/134.0.6998.88/linux64/chromedriver-linux64.zip"
          
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/ || sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          
          # بررسی نصب
          chromedriver --version
          google-chrome --version

      - name: 📦 Install Python dependencies
        run: |
          pip install selenium webdriver-manager requests

      - name: 🚀 Run Pinterest Scraper
        run: |
          cat > pinterest_final.py << 'EOF'
          import os
          import time
          import json
          import requests
          from urllib.parse import quote_plus
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from concurrent.futures import ThreadPoolExecutor
          
          SEARCH_TERM = "${{ github.event.inputs.search_query }}"
          MAX_IMAGES = int("${{ github.event.inputs.max_results }}")
          NUM_SCROLLS = int("${{ github.event.inputs.scrolls }}")
          DOWNLOAD_FOLDER = "downloads"
          
          print("="*60)
          print(f"🎨 Pinterest Chrome Scraper")
          print(f"🔍 Search: {SEARCH_TERM}")
          print(f"🎯 Target: {MAX_IMAGES} images")
          print("="*60)
          
          # تنظیمات Chrome
          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-blink-features=AutomationControlled")
          
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"
          options.add_argument(f"--user-agent={user_agent}")
          
          print("🔧 Launching Chrome...")
          service = Service('/usr/local/bin/chromedriver')
          browser = webdriver.Chrome(service=service, options=options)
          
          # جستجو
          search_url = f"https://www.pinterest.com/search/pins/?q={quote_plus(SEARCH_TERM)}"
          print(f"🌐 Opening: {search_url}")
          browser.get(search_url)
          time.sleep(5)
          
          image_urls = set()
          scroll_count = 0
          
          print(f"\n📸 Extracting images...")
          
          while len(image_urls) < MAX_IMAGES and scroll_count < NUM_SCROLLS:
              scroll_count += 1
              
              # استخراج تصاویر از صفحه فعلی
              script = """
              var urls = [];
              var images = document.querySelectorAll('img[src*="i.pinimg.com"]');
              images.forEach(function(img) {
                  if (img.src) {
                      var url = img.src;
                      if (url.includes('/236x/')) url = url.replace('/236x/', '/originals/');
                      if (url.includes('/474x/')) url = url.replace('/474x/', '/originals/');
                      if (url.includes('/736x/')) url = url.replace('/736x/', '/originals/');
                      urls.push(url);
                  }
              });
              return urls;
              """
              
              new_urls = browser.execute_script(script)
              before = len(image_urls)
              image_urls.update(new_urls)
              new_found = len(image_urls) - before
              
              print(f"  Scroll {scroll_count}: +{new_found} (total: {len(image_urls)})")
              
              if len(image_urls) >= MAX_IMAGES:
                  break
              
              # اسکرول به پایین
              browser.execute_script("window.scrollTo(0, document.body.scrollHeight);")
              time.sleep(3)
          
          browser.quit()
          
          image_list = list(image_urls)[:MAX_IMAGES]
          print(f"\n📸 Found {len(image_list)} images")
          
          if not image_list:
              print("❌ No images found!")
              exit(1)
          
          # دانلود
          print(f"\n🚀 Downloading...")
          os.makedirs(DOWNLOAD_FOLDER, exist_ok=True)
          
          def download_img(url, idx):
              try:
                  headers = {'User-Agent': user_agent}
                  r = requests.get(url, headers=headers, timeout=30)
                  if r.status_code == 200 and len(r.content) > 5000:
                      ext = url.split('.')[-1].split('?')[0]
                      if ext not in ['jpg', 'png', 'jpeg']:
                          ext = 'jpg'
                      path = os.path.join(DOWNLOAD_FOLDER, f"{idx:04d}.{ext}")
                      with open(path, 'wb') as f:
                          f.write(r.content)
                      print(f"✅ [{idx}/{len(image_list)}] {len(r.content)//1024}KB")
                      return True
                  return False
              except Exception as e:
                  print(f"❌ [{idx}] {str(e)[:30]}")
                  return False
          
          downloaded = 0
          with ThreadPoolExecutor(max_workers=5) as ex:
              futures = [ex.submit(download_img, url, i+1) for i, url in enumerate(image_list)]
              for f in futures:
                  if f.result():
                      downloaded += 1
          
          with open(os.path.join(DOWNLOAD_FOLDER, "info.json"), "w") as f:
              json.dump({"query": SEARCH_TERM, "downloaded": downloaded, "total": len(image_list)}, f)
          
          print(f"\n{'='*60}")
          print(f"🎉 Done! Downloaded {downloaded}/{len(image_list)} images")
          print(f"{'='*60}")
          EOF
          
          python pinterest_final.py

      - name: 📦 Create ZIP with splitting if >95MB
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          BASE_NAME="pinterest_${TIMESTAMP}"
          
          if [ -d "downloads" ] && [ "$(ls -A downloads | grep -E '\.(jpg|png)$')" ]; then
            # First create the full zip
            FULL_ZIP="${BASE_NAME}.zip"
            zip -r "$FULL_ZIP" downloads/
            
            # Check file size in bytes (95MB = 99614720 bytes)
            FILE_SIZE=$(stat -c%s "$FULL_ZIP")
            MAX_SIZE=99614720  # 95MB in bytes
            
            if [ $FILE_SIZE -gt $MAX_SIZE ]; then
              echo "📦 File size is $(($FILE_SIZE/1048576))MB, splitting into parts..."
              
              # Split the zip file into 95MB parts
              zip -s 95m "$FULL_ZIP" --out "${BASE_NAME}_split.zip"
              rm "$FULL_ZIP"
              
              # Rename split files to more readable names
              mv "${BASE_NAME}_split.z01" "${BASE_NAME}.z01" 2>/dev/null || true
              mv "${BASE_NAME}_split.z02" "${BASE_NAME}.z02" 2>/dev/null || true
              mv "${BASE_NAME}_split.z03" "${BASE_NAME}.z03" 2>/dev/null || true
              mv "${BASE_NAME}_split.z04" "${BASE_NAME}.z04" 2>/dev/null || true
              mv "${BASE_NAME}_split.z05" "${BASE_NAME}.z05" 2>/dev/null || true
              mv "${BASE_NAME}_split.zip" "${BASE_NAME}.zip" 2>/dev/null || true
              
              # Create a helper script to reassemble
              cat > reassemble_${TIMESTAMP}.sh << 'SCRIPT'
              #!/bin/bash
              echo "To reassemble the split zip files, run:"
              echo "zip -s 0 ${BASE_NAME}.zip --out ${BASE_NAME}_complete.zip"
              echo "Then extract the complete zip file"
              SCRIPT
              chmod +x reassemble_${TIMESTAMP}.sh
              
              echo "✅ Created split archive: ${BASE_NAME}.zip, ${BASE_NAME}.z01, etc."
              echo "SPLIT_CREATED=true" >> $GITHUB_ENV
              echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
              echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
              
              # Add all split files and reassemble script to git
              for file in ${BASE_NAME}.zip ${BASE_NAME}.z[0-9][0-9] reassemble_${TIMESTAMP}.sh; do
                if [ -f "$file" ]; then
                  git add "$file" 2>/dev/null || true
                fi
              done
            else
              echo "✅ File size is $(($FILE_SIZE/1048576))MB, no splitting needed"
              echo "SPLIT_CREATED=false" >> $GITHUB_ENV
              echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
              echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
              git add "$FULL_ZIP"
            fi
          else
            EMPTY_ZIP="empty_${TIMESTAMP}.zip"
            echo "No images found" > result.txt
            zip "$EMPTY_ZIP" result.txt
            echo "SPLIT_CREATED=false" >> $GITHUB_ENV
            echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
            echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
            git add "$EMPTY_ZIP"
          fi

      - name: 💾 Push to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Pull latest changes first to avoid conflicts
          echo "🔄 Pulling latest changes from remote..."
          git pull origin ${{ github.ref_name }} --no-rebase --allow-unrelated-histories || true
          
          # Add all relevant files (in case they weren't added in previous step)
          if [ "${{ env.SPLIT_CREATED }}" = "true" ]; then
            # Add split files
            for file in ${{ env.BASE_NAME }}.zip ${{ env.BASE_NAME }}.z[0-9][0-9] reassemble_${{ env.TIMESTAMP }}.sh; do
              if [ -f "$file" ]; then
                git add "$file" 2>/dev/null || true
              fi
            done
          fi
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No new files to commit"
          else
            echo "📝 Committing files..."
            git commit -m "📸 Pinterest: ${{ github.event.inputs.search_query }} (${{ github.event.inputs.max_results }} images)"
            
            # Push to repository with force option as fallback
            echo "🚀 Pushing to remote..."
            if ! git push origin HEAD:${{ github.ref_name }}; then
              echo "⚠️ Push failed, trying with force lease..."
              git push --force-with-lease origin HEAD:${{ github.ref_name }}
            fi
          fi
          
          # Print summary
          echo ""
          echo "========================================"
          echo "📊 SUMMARY"
          echo "========================================"
          if [ "${{ env.SPLIT_CREATED }}" = "true" ]; then
            echo "✅ Files were split into multiple parts (95MB each)"
            echo "📁 Split files: ${{ env.BASE_NAME }}.zip, ${{ env.BASE_NAME }}.z01, etc."
            echo ""
            echo "🔧 To reassemble the files:"
            echo "   bash reassemble_${{ env.TIMESTAMP }}.sh"
            echo "   # Or manually:"
            echo "   zip -s 0 ${{ env.BASE_NAME }}.zip --out complete.zip"
            echo "   unzip complete.zip"
          else
            echo "✅ Single zip file created: ${{ env.BASE_NAME }}.zip"
          fi
          echo "========================================"
